---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: pierdziocha-os
description: DLa mojej ukochanej pierdzioszki.
base-image: ghcr.io/ublue-os/base-main
image-version: latest
modules:
- type: files
  files:
  - source: system
    destination: /
- type: dnf
  remove:
    auto-remove: false
    packages:
    - firefox
    - firefox-langpacks
    - gnome-software
    - thunderbird
    - gnome-abrt
    - gnome-calculator
    - gnome-calendar
    - gnome-system-monitor
    - gnome-terminal
    - gnome-screenshot
    - yelp
    - f44-backgrounds-gnome
- type: dnf
  repos:
    copr:
    - atim/starship
  group-install:
    packages:
    - cinnamon-desktop
  install:
    packages:
    - micro
    - starship
    - lightdm
    - slick-greeter
    - kitty
    - flameshot
    - mate-calc
    - adw-gtk3-theme
    - dconf-editor
    - gamemode
    - mangohud
    - fastfetch
    - initial-setup-gui
    - cinnamon
    - cinnamon-session
    - cinnamon-desktop
    - nemo
    - shadow-utils
- type: gschema-overrides
  include:
  - zz1-pierdziocha.gschema.override
- type: default-flatpaks
  configurations:
  - notify: true
    scope: system
    install:
    - org.mozilla.firefox
    - io.github.kolunmi.Bazaar
    - io.missioncenter.MissionCenter
    - com.github.tchx84.Flatseal
    - com.valvesoftware.Steam
    - org.vinegarhq.Sober
    - net.davidotek.pupgui2
  - scope: user
- type: chezmoi
  repository: https://github.com/mrkopal/pierdziocha-os
  disable-update: true
  file-conflict-policy: skip
- type: systemd
  system:
    enabled:
    - pierdziocha-update.timer
    - pierdziocha-flatpak-update.timer
    - pierdziocha-firstboot.service
    masked:
    - bootc-fetch-apply-updates.timer
    disabled:
    - initial-setup.service

- type: script
  scripts:
  - preflight-v31.sh
- type: signing
